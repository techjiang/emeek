# 代码质量与性能回归门禁。
# 与 build.yml 分开：构建负责发布，CI 负责「不让回归溜进 main」。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 必须用 pnpm：仓库是 workspace，packages/cli 依赖 packages/core 与 packages/editor。
      # 用 npm install 不会建立 workspace 软链，
      # CLI 会在 import 阶段直接 ERR_MODULE_NOT_FOUND —— 测试全绿但 CLI 挂掉。
      - uses: pnpm/action-setup@v4

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 真浏览器断言需要 Chromium。
      # 为什么不用 jsdom 代替：这一阶段要验的是「脚本会不会真的执行」
      # 「后台标签页的定时器会不会被冻结」——两者都只在真浏览器里成立，
      # jsdom 给的绿灯不构成证据。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Chromium（真浏览器断言用）
        run: |
          python -m pip install --quiet playwright==1.63.0
          python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

      - name: 记录 Chromium 路径
        run: echo "EMEEEK_CHROMIUM=$(find ${{ github.workspace }}/.playwright -name chrome -type f | head -1)" >> "$GITHUB_ENV"

      - name: 单元测试与覆盖率
        run: pnpm coverage

      - name: 基准（本地 AI + 预览渲染）
        run: pnpm benchmark

      # 编辑器（Emeek Studio）的两个硬指标在这里守住：
      #   1. 客户端入口必须能打包出来
      #   2. 入口体积必须小（语言语法留在按需 chunk 里，不进首屏）
      - name: 校验 Studio 客户端打包与入口体积
        run: pnpm check:studio-bundle

      # 预览一致性是 Step 2 的生命线：预览 HTML 必须与构建渲染等价。
      # 它包含在 pnpm test 里，但单独再跑一次并显式打印结果，
      # 是因为这条一旦坏了整个编辑器就失去意义。
      - name: 预览一致性
        run: node --test packages/editor/tests/consistency.test.js

      # 快捷键声明审计（决策 D5）。
      #
      # 这一条的价值在于「没有窗口」：Ctrl+G 那种「表里写了、按下去没反应」
      # 不会先合进来再回头补 —— 它在这里直接失败。
      - name: 快捷键声明审计
        run: pnpm check:shortcuts

      # 消毒核查 + 真浏览器断言（决策 D2）。
      # 判据是「脚本有没有真的执行」，不是「HTML 里有没有 <script>」——
      # 后者能被字符串处理绕过。
      - name: 消毒核查（静态 + 真浏览器）
        run: node scripts/e2e/xss.mjs

      # 草稿安全 e2e（决策 D3）：真浏览器，Node 绿不算数。
      # 定时器被冻结、进程被杀、多标签页接手、软键盘 —— 这四件事
      # 只在真浏览器里成立，jsdom 没有渲染、没有冻结、没有进程。
      - name: 草稿安全 e2e（真浏览器）
        run: node scripts/e2e/draft-mobile.mjs

      # dev 集成 e2e（决策 D4）：真 dev server + 真浏览器。
      # 验「磁盘改动会不会悄悄覆盖本地未保存的内容」—— 这是丢稿的另一条路。
      - name: dev 集成 e2e（真浏览器）
        run: node scripts/e2e/dev-integration.mjs

      # AI 面板 e2e（决策 D1）：三种 Key 模式。
      # 重点是「Key 到底有没有到达浏览器」—— 靠页面里搜一遍来证明，
      # 而不是靠代码里写了什么。
      - name: AI 面板 e2e（真浏览器）
        run: node scripts/e2e/ai-panel.mjs

      # 负向验证：「削弱防线 → 测试必须红」。
      # 一条防线如果削弱了测试还是绿的，它就没被测试守住，
      # 只是恰好写在那儿。这一步把每条防线的守护关系证明一遍。
      - name: 负向验证（削弱防线必须让测试红）
        run: pnpm test:negative

      - name: 构建示例站点
        run: node packages/cli/bin/emeeek.js build --cwd examples/minimal

      - name: 校验产物完整性
        run: |
          set -e
          for f in index.html 404.html archive.html tags.html about.html sitemap.xml rss.xml robots.txt search-index.json; do
            test -f "examples/minimal/dist/$f" || { echo "缺失产物：$f"; exit 1; }
          done
          echo "全部关键产物就绪"
