# 代码质量与性能回归门禁。
# 与 build.yml 分开：构建负责发布，CI 负责「不让回归溜进 main」。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 必须用 pnpm：仓库是 workspace，packages/cli 依赖 packages/core。
      # 用 npm install 不会建立 packages/cli/node_modules/@emeeek/core 软链，
      # CLI 会在 import 阶段直接 ERR_MODULE_NOT_FOUND —— 测试全绿但 CLI 挂掉。
      - uses: pnpm/action-setup@v4

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 单元测试与覆盖率
        run: pnpm coverage

      - name: 本地 AI 模块基准
        run: pnpm benchmark

      - name: 构建示例站点
        run: node packages/cli/bin/emeeek.js build --cwd examples/minimal

      - name: 校验产物完整性
        run: |
          set -e
          for f in index.html 404.html archive.html tags.html about.html sitemap.xml rss.xml robots.txt search-index.json; do
            test -f "examples/minimal/dist/$f" || { echo "缺失产物：$f"; exit 1; }
          done
          echo "全部关键产物就绪"
