<!DOCTYPE html>
<html lang="{{ site.language }}" data-theme="{{ config.theme.darkMode }}" data-theme-mode="{{ config.theme.darkMode }}" {{ themeFeatureAttrs }}>
<head>
    {% include "head" %}
</head>
<body class="layout-archive">
    {% include "header" %}
    <main class="site-main">
        <div class="section-head">
            <span class="section-number" aria-hidden="true">00</span>
            <h1 class="section-title">全部期刊</h1>
        </div>
        {% for group in groups %}
        <section class="archive-year">
            <h2>{{ group.year }}</h2>
            <ul class="archive-list">
                {% for post in group.posts %}
                <li>
                    <time datetime="{{ post.date }}">{{ post.dateFormatted }}</time>
                    <a href="{{ post.url }}">{{ post.title }}</a>
                </li>
                {% endfor %}
            </ul>
        </section>
        {% endfor %}
        {% if groups.length == 0 %}<p class="empty">还没有文章。</p>{% endif %}
    </main>
    {% include "footer" %}
</body>
</html>
