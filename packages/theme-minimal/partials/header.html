<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">◆</span>
            <span class="brand-text">{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
            {% for item in nav %}
            <a href="{{ item.url }}">{{ item.title }}</a>
            {% endfor %}
        </nav>
        <div class="header-actions">
            {% if searchPageUrl %}<a class="icon-button" id="search-link" href="{{ searchPageUrl }}" aria-label="搜索">⌕</a>{% endif %}
            <button class="icon-button" id="theme-toggle" type="button" aria-label="切换主题">◐</button>
        </div>
    </div>
</header>
